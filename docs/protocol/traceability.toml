# *element 7 of signal 204* and nothing published said what signal 204's elements
# are called, so the two numbers met only in a sentence in `rows_readable`. Prose
# is what P-206 exists because somebody implemented from. `signal_series` is that
# descriptor, and the integration test reads both artefacts and joins them --
# move either and it goes red.
