# Requirements nothing can test, and a count of the ones nobody has tested yet.
#
# Read with docs/protocol/VERIFICATION.md section 1, which carries the
# reasoning. `cargo xtask check` sorts every **P-nnn** in PROTOCOL.md and every
# **L-nnn** in LINK.md into three buckets: covered by a test named after it that
# can actually fail, declared here, or uncovered.
#
# The two are different words. Uncovered means nobody has written the test.
# Untestable means no test can be written, and it needs a kind and a reason
# somebody argued for in review. Filling this file with `deferred` entries to
# make the count go down turns "we have not written tests" into "these are
# untestable", which is the graveyard this file exists to not become.

# The number somebody defends at each audit round: requirements that are neither
# covered nor declared below.
#
# The check fails when the real count goes above it, and fails when it drops
# below and this number was not lowered with it — a ratchet nobody tightens
# rusts open, and the slack quietly absorbs the next rules nobody covers. It
# started at nearly the whole specification, because when it was written not one
# test in the workspace stood behind a requirement, and a check that is red on
# its first run is a check somebody switches off before its second.
#
# It goes up for exactly one reason: the specification gained a rule. Anything
# else moving it up is a test that stopped standing behind something.
#
# 42 -> 48, and this is that reason. PROTOCOL.md gained the five descriptor row
# bodies and eight rules with them, P-200 through P-207, promoted out of
# TOPOLOGY-DESIGN.md because the rows had been published in vectors/v1.json --
# 61 keys of them -- with nothing in any settled document defining them.
#
# Two of the eight arrived covered: P-200 by the sentinel test in signals.rs and
# P-207 by the six identity tests beside it. The other six went up. That is not
# six tests nobody bothered to write: P-201's empty-array refusal, P-202's addr
# uniqueness, P-203's rollup cycles, P-204's unit-and-scale condition, P-205's
# since and P-206's ebase arithmetic are all rules about a row this controller
# does not yet register -- there is no parameter table in o89-core at all, and
# no component table with a rollup on it. A test named after one of them today
# would stand over nothing, which is the failure this whole file exists against.
#
# They come down as the rows land, not as somebody finds a name to give a test.
#
# 48 -> 47, and it is one of those six coming down the way that paragraph said
# they would. P-202 -- `addr` present exactly where the bus addresses, and unique
# within a bus -- is covered because `Topology` now holds device rows and can be
# asked. Two devices at one address on one pair is the failure: only one is ever
# heard, which one depends on the wiring rather than on any file, and the silent
# one's readings appear under the other's signals.
#
# P-201, P-204, P-205 and P-206 stay up. They are about `cmds` arrays,
# parameters and `ebase`, and none of those exists yet.
#
# **That sentence was false when it was written, and an audit for exactly this
# shape of claim is what found it.** All five row kinds are in `inventory.rs`
# with `cmds` on two of them, `since` required on two, and `ebase`, `unit`,
# `scale` and `vns` on a `SignalRow` -- encoded, width-tested, and published in
# `vectors/v1.json`. The reason was written about `o89-core`'s tables; the rules
# bind the row encoder, which existed the whole time. A blocker stated once and
# never re-read is how four requirements sit in this count on the strength of a
# sentence nobody checked.
#
# 47 -> 46. P-203's rollup half is covered now that `Topology` holds component
# rows: a rollup names a component that is already there, so the charger's
# combined PV figure cannot be declared already-counted in something nothing
# describes. The double-the-sun half of P-203 -- a client MUST NOT combine a
# component with the one it rolls up into -- is a client rule and stays
# uncounted here for the same reason P-125 does.
# 46 -> 47, and this is the second reason the file allows: a citation that was
# never standing behind anything. P-143 says which refusal a session-requiring
# request gets -- error 4 before any `Hello`, error 9 on a session the controller
# does not hold -- and it was claimed by a `cites:` header on `envelope.rs`.
# Nothing in the tree performs either refusal and no test asserts one. The
# decision belongs to a request dispatcher, which does not exist.
#
# Found by the check that now prints how many covered rules have no test named
# after them: fifty-six of them, a third of the count, resting on a header that
# claims a requirement for a whole file. Most are honest -- `crc.rs` claiming the
# CRC rule is a file about nothing else -- and that list is the reading queue.
# P-143 was the first one read.
#
# It is uncovered rather than deferred on purpose. A test can be written the day
# there is a dispatcher to drive, which is the line this file draws between the
# two words.
#
# 47 -> 48, and it is the first reason again: the specification gained four rules
# when `Concerns 0x0F`/`0x8F` was promoted into it. Three of the four arrived
# covered by tests that were already asserting them under other names -- P-208's
