# P-045 is the shape this file is for. Nothing can drive an implementation into
# transmitting a key it does not have, so the thing that stands behind it reads
# the corpus rather than an implementation: every derived key and the printed
# secret, hunted for in the bytes of every MAC'd body in the vectors. The check
# named here has to be one `cargo xtask check` actually runs, or the nomination
# reads as coverage forever.
[[entry]]
id = "P-045"
kind = "spec-check"
check = "no_response_carries_key_material"
reason = """
No test can prove a negative about every implementation. What can be proved is \
that no artefact we publish carries key material, which is what \
no_response_carries_key_material reads out of the vectors — the bytes, not the \
description of the bytes, because an early draft returned the client's \
long-term key in a perfectly well formed pairing response."""

# The subject of P-033 is a connector. A host test cannot tell a board that
# carries RTS/CTS from one that does not, because on the host both are a `Vec`.
[[entry]]
id = "P-033"
kind = "hardware"
reason = """
The requirement is about two wires. It is proved on the bench by a worst-case \
frame ten thousand times at 921600 with flow control, zero CRC failures, and \
the same run with the two lines disconnected, which must fail — proving the \
requirement by demonstrating its absence is the only thing that stops it being \
a sentence. The dated bench log that records it is named here once it exists; \
until a board with the production connector has been run, this entry is what \
says nobody has checked."""

# VERIFICATION.md section 1 names this file's four kinds and gives a worked
# example of each. Two of those examples are requirements, and neither had an
# entry here — so the document that governs this file and the file itself
# disagreed about which bucket two rules were already in.

# P-075 is a SHOULD about a client, and the half that matters is a person.
[[entry]]
id = "P-075"
kind = "judgement"
reason = """
A test can prove the controller surfaced a regressed `log_newest_seq` or \
`state_seq`, and nothing can prove an operator read it. It is SHOULD rather \
than MUST for a reason this corpus states out loud: a board swap or a NOR erase \
regresses the sequence legitimately, and a hard rule would turn a repair into a \
lockout at a site four hours from a road. Saying that here is more honest than \
a test named after the surfacing that stands in for the reading."""

# Requirements that state more than one thing.
#
# A rule with two clauses used to read as covered the moment one of them had a
# test. P-164 sat that way: the validity clause tested, the concern clause
# unwritten, and the only thing that said so was a paragraph in
# TOPOLOGY-DESIGN.md saying the matrix could not tell. A half-built rule read
# greener than an unbuilt one, which is the worst direction for this file to be
# wrong in — nobody goes looking at a number that is already green.
#
# A clause is a fragment of a test name. Not a count of tests, because two tests
# about the same clause satisfy a count and prove nothing. Renaming a test that
# stands behind a clause turns this red on purpose: the rename is exactly when
# somebody should be asked whether the clause still has a test.
#
# This table is for rules that say two things. Most say one, and adding them
# here would make it a tax rather than a check.

[[clauses]]
id = "P-164"
each = ["is_never_published", "raises_a_concern"]
reason = """
Two sentences joined by MUST and MUST: report `validity 8 unnamed_state` with \
no value, and raise a concern carrying the source's own code and namespace. The \
first was built and tested for months while the second did not exist — there \
was no concern table in o89-core at all — and the matrix read the rule as \
covered throughout."""

[[clauses]]
id = "P-202"
each = ["required_exactly_where", "one_address_on_one_bus"]
reason = """
Presence and uniqueness are different failures. An addressed transport with no \
address is a device nothing can reach; an unaddressed one carrying an address \
is a number nothing uses. Two devices at one address on one bus is the worse \
half, and a test for either one alone leaves the other looking checked."""

[[clauses]]
id = "P-187"
each = ["cycle_is_unconstructible", "deeper_than_the_cap"]
reason = """
A chain that returns to where it started makes every walk non-terminating; one \
past the cap makes a walk unbounded on a controller with no allocator to bound \
it. Both are refused and they are refused by different code, so one test cannot \
stand behind the other."""

[[clauses]]
id = "P-180"
each = ["only_when_it_is_over", "cid_is_reused_only_after"]
reason = """
`cleared` being terminal and a `cid` not being reallocated until the record \
announcing it is committed are two rules with one number. The first is about \
what a client still sees; the second is about a client acknowledging by an id \
that now means something else."""

# The client half of this one — a page count is `min(row cap, byte cap ÷ row
# width)` — stays uncounted for the reason P-203's does. It binds whoever reads
# the response, and nothing in this tree reads one.
[[clauses]]
id = "P-211"
each = ["carries_the_age_it_accumulated", "raised_again_starts_at_zero"]
reason = """
Carrying the age across a restart and refusing to restore a row that cannot be \
dated are two halves with one number, and the second is the one with no obvious \
encoding: key 9 is always present, so there is no third value meaning *unknown*. \
The answer is that the row is not restored at all and the condition is raised \
again under a new `cid`, which is a different assertion from the first and fails \
on a different implementation."""

[[clauses]]
id = "P-051"
each = ["close_the_connection", "do_not_clear_the_count", "counts_against_the_shed"]
reason = """
Verify-before-decode and the shed counter are one rule number over two crates, \
and the second half was named in three doc comments as belonging somewhere \
else. Closing the connection at the cap, not clearing the count on a fresh \
`Hello`, and counting only a proof that was computed and failed are three \
different pieces of code: the first bounds the CPU a peer can spend, the second \
is what makes it a threshold rather than a formality, and the third is what \
stops anybody closing a technician's connection by sending `Pair` at a \
controller with no window open."""

[[clauses]]
id = "P-143"
each = ["before_any_hello", "does_not_hold"]
reason = """
Error 4 and error 9 are two states of a connection row and they are told apart \
by different code: nothing has proved on it, against something has and it is not \
this session. A client that gets the wrong one of the two is told to do the \
wrong thing -- *Hello first* to a client already past that, or *your session is \
gone* to one that never had one."""

[[clauses]]
id = "P-182"
each = ["quiet_pair", "clearing_at_dawn", "one_event_and_not_one_per_device", "still_owes"]
reason = """
Four things with one number, and they are bounded in three different tables by \
three different pieces of code: the validity sweep in the controller's \
`store.rs`, the concern sweep in `concerns.rs`, and the presence sweep in the \
controller's `presence.rs`. A test for one \
leaves the other two looking checked, which is exactly how this rule sat \
unpromoted -- it was written whole and buildable a third at a time. The fourth \
clause is the carry-over, and it is the one a `const_assert!` over four \
constants cannot see: delete it and every cap still holds while 336 of 384 \
changes disappear."""

[[clauses]]
id = "P-205"
each = ["first_appeared", "replaced_instrument"]
reason = """
Two rows with two different triggers under one number: a `DeviceRow` is re-dated \
when the **physical instrument** behind it changes, a `ComponentRow` when **that \
row's meaning** does. The half with no obvious encoding is the first clause -- \
there is no value meaning *never changed*, so a row that has been through \
nothing carries the revision it first appeared at, and a test for the \
replacement alone leaves that looking checked while an implementation is free to \
send a zero somebody renders as *rev 0*."""

[[clauses]]
id = "P-022"
each = ["already_took", "older_than_the_reorder_window", "unanswered"]
reason = """
The two refusals the controller owes fail differently, and what follows them \
fails a third way. A repeat replays an \
**answer** as well as a request, because the response MAC covers \
`(type, session_id, req_id)` and nothing that moves. A stale one is a frame \
captured off the air in the morning and delivered at midnight, whose MAC, \
counter and dedup entry are all satisfied by the time it lands -- and P-022's \
receiver rule is the only thing in the corpus that notices. Either refusal \
answered under the session key mints a second genuine response to a pair \
already answered, and a refusal that refreshes the session is a keep-alive the \
relay holds, so the silence gets a test of its own. The client's own \
half -- strictly increasing, never reused, no more than `MAX_INFLIGHT` \
outstanding -- stays uncounted, because the rule says in bold that the \
controller MUST enforce rather than trust it, so the client half is not what \
makes it true."""

[[clauses]]
id = "P-085"
each = ["nothing_is_cleared_until", "bars_pairing_until_one_succeeds"]
reason = """
**Two of this rule's four controller obligations have an actor and two do not, \
and the entry exists to stop the covered mark reading as all four.** What is \
real is the ordering, and it is real in the strongest way available: `Clearing` \
is the permission to clear, its field is private and there is no constructor, so \
*clear before the epoch reads back* cannot be written. That is why this citation \
stands where P-022's did not -- P-022's *before the counter is read* needs the \
counter path to exist before anyone can check it, and this needs nothing. A \
failed read-back returning no `Clearing` is the second half, and it is the same \
guarantee.

What has no actor: **nothing raises the concern** at `epoch write failed` \
though the condition is allocated and named here, **nothing consults \
`may_pair`** because no `Pair` is answered anywhere -- which is the same absence \
that took P-066, P-067 and P-078 off `pairing.rs` -- and **there is no client \
table to clear**. The cryptographic half is elsewhere and uncounted: `kdf.rs` \
makes a key derived under epoch *n* unusable at *n+1*, and `pairing.rs` refuses \
a zero epoch as FRAM nobody wrote."""

[[clauses]]
id = "L-180"
each = [
    "only_the_three_a_clients_own_frame_raised",
    "no_refusal_from_a_client_transport",
]
reason = """
Which three reach a client and which six must not are two halves that fail \
differently. Withhold one of the three and a client retries forever against a \
refusal it never hears; leak one of the six and a browser is shown `no \
authorisation` or `link major mismatch` -- true statements about a machine it is \
not talking to, and nothing at all about its own request, so whoever is reading \
the screen goes looking for a permission problem in the client. The second \
clause is also the one that needs a **driver** rather than a predicate: a \
classification nothing consults is a comment with a return type, so the test \
runs every way an envelope can be refused through the one function that turns a \
client-facing decode into a code on the wire."""

[[clauses]]
id = "P-206"
each = ["numbers_its_elements_from_one", "cell_twenty_three", "labels_leave_u16"]
reason = """
The default, the arithmetic and the range are three separate failures. An \
omitted `ebase` read as 0 numbers every cell of every unnumbered string one \
below what somebody counting them out loud would say; `elem` rendered as a label \
rather than added to `ebase` sends them to the other pack entirely; and a base \
near the top of `u16` wraps, which is not a missing label but a **different \
cell**. All three produce a small number that parses and MAC-verifies, and the \
second passes a test written only for the first -- a series based at 1 gives the \
same answer whether the reader adds `ebase` or ignores it, which is the fixture \
anybody writes first."""

[[clauses]]
id = "P-208"
each = ["row_cap", "byte_cap"]
reason = """
Two arms, and the whole rule is that either can bind first. A page of narrow \
rows runs out of rows and a page of wide ones runs out of bytes, and a test for \
one leaves the other looking checked — which is how a cap nobody can reach ends \
up being planned against. The arms bind in different messages, so the tests are \
in different crates: the row arm in `concerns.rs`, where twelve widest rows are \
756 bytes against 832 and the byte cap is never touched, and the byte arm in \
`inventory.rs`, where five widest device rows spend 850 of 880 and the row cap \
of 48 is nowhere near."""

[[clauses]]
id = "P-209"
each = ["by_cid_ascending", "is_still_a_row_the_walk_returns"]
reason = """
The order and what `total` counts are two ways for one walk to lie. Ordered by \
where a row landed in the table, two pages hold one row twice and miss another. \
Counting only the rows still going wrong, `total` comes back smaller than the \
number of rows the same walk delivers, and a client cannot tell a short page \
from a torn one. Both pass every other assertion on the page."""

# The FRAM half is the controller's: this tree holds no persistent store and no
# authorisation table, so the fragment stays unnamed here until it does.
[[clauses]]
id = "L-170"
each = ["carries_the_digest", "records_the_digest_in_fram"]
reason = """
What goes on the wire and what survives a reboot are two ways for one \
authorisation to come apart. An authorise without its digest is an image \
nothing can check, and a decoder that filled in zeroes would let it through \
looking checked. A digest that lived only in RAM is gone after the brown-out \
mid-install that is the ordinary case on a weak bank, leaving the comms \
processor holding bytes nothing authorised. The first is refused where the \
body is read; the second needs a controller with FRAM behind it."""

# The client half — restart a walk whose `seq` moved — is a client rule and stays
# uncounted, like P-208's.
[[clauses]]
id = "P-210"
each = ["moves_the_pin", "does_not_tear_a_walk"]
reason = """
Moving the pin and not moving it are separate failures with opposite costs. A \
pin that never moves cannot report a torn walk at all; a pin that moves on every \
state change tears every walk in progress on the morning thirty-two per-cell \
rows clear at once, which is the site this table was sized for. The second test \
is the one that fails on the tempting implementation, and it passes the first."""

[[clauses]]
id = "L-034"
each = [
    "fits_and_reads_back",
    "writes_only_the_version_format",
    "hw_names_the_board",
    "controller_fw_is_fw_controller",
    "release_version_uses_the_format",
    "still_brings_the_link_up",
]
reason = """
Six things with one number, and they fail in different places. The limits fail \
on paper: a version legal under the format but past 32 bytes is one a unit \
stores and cannot send. The `LinkUp` encoder fails in this crate: one that \
writes `0.1.0` with no commit leaves a bench log nothing can match to a unit, \
and the peer has to carry it. The release encoders fail the same way and are \
tested beside it. A board name the hardware repository does not write and a \
`fw_controller` that is not the controller's own `fw` each fail somewhere this \
tree has no code for yet, and a test for the encoders leaves both looking \
checked. The receiver \
clause fails on the link: a controller that refuses a text in another shape \
takes every client off the air over a label."""

[[clauses]]
id = "L-133"
each = ["unwritten_clear_has_only_op_and_zero_version", "pushes_on_every_version_mismatch", "erases_durably_and_stops_wifi"]
reason = "The codec proves the unwritten master is representable without radio metadata. Firmware#88 owns sending it after a foreign LinkUp; firmware#89 owns NVS erasure, shutdown and failed-erase recovery."

[[clauses]]
id = "L-135"
each = ["written_operations_cannot_use_zero_version", "factory_reset_increments_and_pushes_clear"]
reason = "The codec preserves the nonzero written-clear contract. Performing the reset and sending the incremented version remain firmware#88's integration evidence."


[[clauses]]
id = "P-066"
each = ["closed_window", "first_enrolment_power_on_without_pushbutton"]
reason = """
The caller supplies the window state; KM43 does not decide when a controller \
opens it. The crate answers a closed window with outcome 2 under the label's \
refusal tag (P-241), which is the `closed_window` clause. Firmware must prove that boot reads a valid empty client table, \
once-per-boot opening at boot, 120-second expiry, first-Pair closure, no opening \
with a non-empty table, renewed eligibility after factory reset or recovery, \
no opening on the boot that repairs an absent or unreadable table, eligibility \
on a later boot that reads the valid empty table, and exclusion of \
boards with a pushbutton. The pairing handshake still needs the label. The \
controller also owes L-193 through L-195 reports, including a delayed link's \
remaining time. Codec and closed-window refusal tests do not prove that lifecycle, \
and the label's pre-shared key is still required inside the window."""


[[clauses]]
id = "P-217"
each = ["keys_travel_together", "failed_scan_keeps_the_list"]
reason = "The codec refuses a list without its age or count. Holding one list and keeping it across a failed scan is the controller's state, owed by origin89hq/firmware#138."

[[clauses]]
id = "P-219"
each = ["keys_present_exactly", "dropped_on_link_loss"]
reason = "The codec refuses a body whose keys disagree with its state. Dropping the report on link loss or a new comms boot is the controller's, owed by origin89hq/firmware#138."

[[clauses]]
id = "L-200"
each = ["scan_number_is_never_zero", "refused_without_radio_metadata"]
reason = "The codec refuses scan 0. One scan outstanding and no scan without a country are the two firmwares' behaviour, owed by origin89hq/firmware#138."

[[clauses]]
id = "L-201"
each = ["list_exactly_when_complete", "one_result_per_started_scan"]
reason = "The codec refuses a result whose rows disagree with its outcome. Sending exactly one result per started scan is the comms processor's, owed by origin89hq/firmware#138."

[[clauses]]
id = "L-202"
each = ["one_row_per_ssid_strongest_first", "hidden_and_non_utf8_counted_not_listed"]
reason = "The codec refuses repeated, unordered or oversized lists. Leaving out hidden and non-UTF-8 networks and counting them is the comms processor's scan filter, owed by origin89hq/firmware#138."

[[clauses]]
id = "L-204"
each = ["reason_and_address_belong_to_their_state", "sent_once_linked_and_on_change"]
reason = "The codec refuses a reason or address the state does not own. When the comms processor reports, and that joining appears once per installation of credentials, are its own, owed by origin89hq/firmware#138."

[[clauses]]
id = "P-220"
each = ["joining_is_never_recorded", "spaced_per_version", "first_join_after_failure_is_immediate"]
reason = "The encoder refuses a joining record. When a record is due, and the ten-minute spacing per version, are the controller's, owed by origin89hq/firmware#138. Writing a version's first joined after a failed at once is the controller's too, owed by origin89hq/firmware#149."

[[clauses]]
id = "P-108"
each = ["version_0_and_an_absent_body_come_together_or_not_at_all", "unreadable_section_answers_unwritten_and_write_replaces_record"]
reason = "The codec checks that version 0 and an absent body travel together. A never-written or unreadable section must produce that same answer, and an accepted write against expected_version 0 must replace what the controller holds. Detecting and repairing a damaged record belongs to origin89hq/firmware; the codec test does not prove that recovery."


[[clauses]]
id = "P-222"
each = ["carry_no_printed_secret", "another_controller_is_refused", "does_not_discard_the_enrolment", "app_keeps_no_printed_secret", "app_moves_on_from_another_controller"]
reason = "The stored encoding holds the client's key pair, the pinned controller key and the suite, and a restore checks the device only: a differing epoch in an unauthenticated Discover is a reason to expect the Hello to fail, not to throw the key away. Discarding the scanned printed secret once the enrolment is confirmed is the app's, owed by origin89hq/apps#8. Trying the next candidate rather than pairing when another controller answers is the app's, owed by origin89hq/apps#19."

[[clauses]]
id = "L-035"
each = ["controller_link_up_carries_device_id", "comms_advertises_only_the_latest"]
reason = "The codec requires key 8 from the controller, refuses it from comms or at another length, and the published controller LinkUp carries Discover's device_id. Using it only as the TXT id, from the latest controller LinkUp, is the comms processor's, owed by origin89hq/firmware#146."
