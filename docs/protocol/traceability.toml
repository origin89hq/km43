# The rule that the count only rises when the specification gains a rule
# holds one repository over. origin89 keeps the controller's tests, its own
# copy of this ratchet and the 33, and when it is rebuilt against this
# repository its count walks this tree beside its own crates. What this number
# now says is what the wire crate's own tests stand behind, and it comes down
# for the same two reasons it always did: a test written here, or a rule that
