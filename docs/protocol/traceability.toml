#   P-097  a client must not re-read the log on every hole. `o89-cli` neither
#          subscribes nor tracks `seq` gaps, so there is no hole to react to.
#   P-119  the same client, comparing its highest accepted `seq` against what
#          arrives inside MAC'd responses. Same absence.
#   P-123  `inhibited` and `shadowed` are outcomes, not errors. Half is
#          reachable: nothing produces the wire `Command::Inhibited`, and
#          `Decision::Inhibited` lives in the behaviour layer and never reaches
#          an ack. A test would assert what an enum contains.
#   P-112  events written with no timestamp are never stamped later. No path
#          writes one, so there is nothing to leave alone.
#
# **They stay uncovered on purpose.** The header of this file draws the line
# between *uncovered* and *untestable* and says what filling the gap with
# declarations turns this into. A rule whose subject has not been built is not
# untestable; it is untested, and the discomfort is the point. P-143 is the
# precedent -- it sat here waiting for a dispatcher and then turned out not to
# need one, which is an argument against declaring anything early.
#
# The 23 `L-` rules are one absence rather than 23: LINK.md describes the comms
# processor's protocol and no code in this tree implements it.
#
# What did come down: P-012 and P-017 needed no new capability and had simply
# never been looked at; P-014 and P-068 were implemented and unnamed; P-024 and
# P-071 needed the cable to stop being a serial port before a test could reach
# them, which is the seam being in the wrong place rather than the rule being
# hard. P-055 was implemented **wrongly** and the test is the fix.

# 33 -> 122, and the specification did not gain a rule. The protocol moved
# into its own repository, and the controller's tests did not come with it:
# 27 files in `o89-core` and one in `o89-cli` carry `p_nnn_` and `l_nnn_`
