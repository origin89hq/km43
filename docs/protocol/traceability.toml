# 44 -> 43. P-205 comes down, and it is the entry above coming true rather than
# a name found for a test: *set `since` when the thing behind the row changes*
# needed a controller that maintains rows, and now there is one. `Topology`
# carries the revision its rows are, stamps `since` on every row it takes, and
# has the two operations that move it -- a device replaced, a component that
# means something else.
#
# **`since` is stamped and is not a field of the row**, which is what makes it
# worth anything: a config write declares what a device *is*, and the controller
# says when it last became that. A caller-supplied `since` is a number a driver
# can get wrong, and the whole point of the field is that a client refuses to
# plot history across it -- a wrong one draws the old shunt and the new one as
# one continuous meter, with a step in the middle that reads as consumption
# nobody had.
#
# It takes a `[[clauses]]` entry because it names two rows with two different
# triggers, and one test cannot stand behind both.
#
# The revision moving *with* the row is not decoration either: P-150 makes a
# descriptor change a revision change, and two calls leave a window where the row
# describes the new instrument under the old `rev`. A client fetching inside it
# caches a row nothing will ever tell it to discard. It also closed a hole this
# file did not know about -- `Presences::same_revision` could not check the
# topology's revision because a `Topology` did not have one, and it does now.

