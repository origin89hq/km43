# Install the Changesets config and package scripts before enabling this workflow.
# https://github.com/origin89hq/engineering/blob/main/docs/adopting.md
name: origin89-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: origin89-release
  cancel-in-progress: false

jobs:
  select-mode:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Prepare and validate the release PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm release:version
          pr-title: "chore: release packages"
          commit-message: "chore: release packages"

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: git diff --exit-code
      - name: Pack the validated package
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish the prepared package and release notes
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          NPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_PROVENANCE: "true"
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  # The Rust crate. Changesets versions package.json and nothing else, so the
  # crate's version is the one in crates/km43/Cargo.toml and a release is a PR
  # that moves it: every push to main compares that version with crates.io and
  # publishes it when it is not there yet. crates.io's trusted publisher for
  # km43 names this repository and this workflow filename.
  crate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compare the manifest version with crates.io
        id: version
        run: |
          version="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "km43") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsS https://index.crates.io/km/43/km43 | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
            echo "km43 $version is already on crates.io"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "km43 $version is not on crates.io"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: cargo test --locked --workspace
      - if: steps.version.outputs.publish == 'true'
        run: cargo xtask check
      - if: steps.version.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - if: steps.version.outputs.publish == 'true'
        run: cargo publish --locked -p km43
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - if: steps.version.outputs.publish == 'true'
        run: gh release create "km43-v$VERSION" --target "$GITHUB_SHA" --title "km43 $VERSION" --notes "https://crates.io/crates/km43/$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
