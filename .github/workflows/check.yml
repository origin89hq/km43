# The gate. Everything here is also `just check` or `just msrv-check`, so a red
# run reproduces locally with one command. The toolchain, its components and the
# cross-compile targets come from rust-toolchain.toml, and the MSRV from
# Cargo.toml; nothing is pinned twice.
name: check

on:
  push:
  pull_request:
  # A release PR opened with the default token triggers nothing on its own;
  # this is how it gets checked before it merges.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate pending changesets
        if: hashFiles('.changeset/*.md', '!.changeset/README.md') != ''
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show-ref --verify --quiet "refs/heads/$BASE_BRANCH" || git branch --no-track "$BASE_BRANCH" "origin/$BASE_BRANCH"
          pnpm changeset status
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'
      - run: just check
      - run: git diff --exit-code
      - run: pnpm --filter @origin89/km43 pack --dry-run

  # Consumers may still build with the compiler `rust-version` names. A
  # host-only check on that compiler is what keeps the declaration honest.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'
      - run: rustup toolchain install "$(just --evaluate msrv)" --profile minimal
      - run: just msrv-check
