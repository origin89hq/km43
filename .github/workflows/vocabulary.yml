# Watches the equipment dataset's vocabulary pin. The gate never fetches, so a
# word the dataset renamed would go unnoticed until somebody ran the sync by
# hand; this runs it once a day and turns a moved vocabulary into a pull
# request a person reviews. It never pushes to main, and nothing merges on
# its own.
#
# A pull request opened with the workflow's own token gets no `check` run of
# its own (GitHub does not start workflows from that token), so the gate is
# run here and its result written into the PR body. Rerunning `check` on the
# PR after a push by a person gives it a run of its own.
name: vocabulary

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vocabulary
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'

      - name: Compare the pin with what the dataset publishes
        id: compare
        run: |
          set -o pipefail
          cargo xtask vocabulary | tee report.txt
          if grep -q '^the pin is current' report.txt; then
            echo 'moved=false' >> "$GITHUB_OUTPUT"
          else
            echo 'moved=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Move the pin and regenerate
        if: steps.compare.outputs.moved == 'true'
        run: |
          cargo xtask vocabulary --accept
          just registry

      # `continue-on-error`: a red gate is the finding, not a reason to stop
      # before the pull request that shows it.
      - name: Run the gate
        id: gate
        if: steps.compare.outputs.moved == 'true'
        run: |
          if just check > gate.txt 2>&1; then
            echo 'result=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failed' >> "$GITHUB_OUTPUT"
          fi
          tail -n 40 gate.txt

      - name: Open or update the pull request
        if: steps.compare.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.gate.outputs.result }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B bot/vocabulary
          git add crates/km43/dataset-vocabulary.json crates/km43/protocol.toml \
            crates/km43/src/generated.rs packages/km43/src/generated.ts \
            docs/protocol/REGISTRY.md docs/protocol/MAP.md
          git commit -m 'chore: move the dataset vocabulary pin'
          git push --force origin bot/vocabulary

          {
            echo '## Change'
            echo
            echo 'The equipment dataset published a vocabulary that differs from the pinned one. `cargo xtask vocabulary --accept` moved the pin and `just registry` regenerated the bindings and `REGISTRY.md`; this is that diff, for a person to read. Opened by the `vocabulary` workflow, which never merges.'
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo '## Validation'
            echo
            if [ "$GATE" = passed ]; then
              echo '`just check` passed in the workflow run: every crosswalk row still names a word the new vocabulary holds.'
            else
              echo '`just check` **failed** in the workflow run. The tail below names the crosswalk rows that lost their word; carry or absent them in `protocol.toml` on this branch.'
              echo
              echo '```'
              tail -n 40 gate.txt
              echo '```'
            fi
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A pull request opened by the workflow's token gets no \`check\` run of its own; push to the branch or rerun \`check\` to give it one."
          } > body.md

          number="$(gh pr list --head bot/vocabulary --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file body.md
            echo "updated #$number"
          else
            gh pr create --base main --head bot/vocabulary \
              --title 'chore: move the dataset vocabulary pin' --body-file body.md
          fi
