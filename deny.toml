# Copy to the Cargo workspace root; see engineering's docs/dependencies.md.
# Add a license or exception only after reading the crate's terms, and record why.

[advisories]
yanked = "deny"

[licenses]
# The shared list covers several repositories; unused entries are expected.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
