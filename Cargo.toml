[workspace]
resolver = "3"
members = ["crates/km43", "crates/xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/origin89hq/km43"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
ciborium = "0.2.2"

sha2 = { version = "0.11.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
hkdf = { version = "0.13.0", default-features = false }

# Constant-time comparison, which a hand-rolled loop cannot promise: the
# optimiser is free to turn one into an early return.
subtle = { version = "2.6.1", default-features = false }
