[workspace]
resolver = "3"
members = ["crates/km43", "crates/xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/origin89hq/km43"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
ciborium = "0.2.2"

sha2 = { version = "0.11.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
hkdf = { version = "0.13.0", default-features = false }

# The key agreement and the session cipher. No default
# features: those pull in `alloc`, `getrandom` and precomputed tables the
# controller has neither the RAM nor the flash for. The caller supplies every
# random byte, as it supplies every other byte.
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }

# The vector generator's Noise. A second implementation of the handshakes,
# written by other people, so the published messages are not the crate's own
# code agreeing with itself.
snow = { version = "0.10.0", default-features = false, features = ["std", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "risky-raw-split"] }

# Constant-time comparison, which a hand-rolled loop cannot promise: the
# optimiser is free to turn one into an early return.
subtle = { version = "2.6.1", default-features = false }

# Volatile writes the optimiser may not remove, which is what clearing a key
# that is about to be freed needs: a plain `fill(0)` on a value nobody reads
# again is a dead store and can be deleted.
zeroize = { version = "1.9.0", default-features = false }

# Optional, behind the crate's `defmt` feature: the target logger's `Format`.
defmt = { version = "1.1.1", default-features = false }
