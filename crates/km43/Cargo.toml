[package]
name = "km43"
version = "0.8.0"
description = "KM43, the bounded, authenticated message protocol between an Origin89 controller and its clients"
readme = "../../README.md"
keywords = ["protocol", "no-std", "embedded", "cbor"]
categories = ["no-std", "no-std::no-alloc", "encoding", "embedded"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Cargo packages the targets of these symlinks: the root licenses and the
# canonical docs/protocol/vectors/v1.json, without a second generated copy.

[dependencies]
# The same audited primitives the generator uses. Sharing them means the
# published vectors no longer prove our HMAC independently — but what the
# vectors are for is the *preimage*, which is what varies, what a label bug
# already broke once, and what stays independent. Agreement with RFC 4231
# covers the primitive, and there is nothing to gain from our own SHA-256: it
# is a fixed function with no restriction of ours to enforce, unlike the CBOR
# subset.
hkdf.workspace = true
hmac.workspace = true
subtle.workspace = true
# `zeroize` clears the SHA-256 state and block buffer on drop, which is also
# what an HMAC is made of. Without it the buffer still holds the printed secret
# after the key derived from it has been cleared, because HKDF's extract feeds
# that secret through it as ordinary input. `mac.rs` fails the build without it.
sha2 = { workspace = true, features = ["zeroize"] }

# The key agreement and the session cipher (P-226). The generator uses the same
# primitives through `snow` and checks both against RFC 7748 and RFC 8439; what
# the vectors witness independently is the handshake and the transport built on
# them, which is what varies.
x25519-dalek.workspace = true
chacha20poly1305.workspace = true

# The key types clear their bytes on drop, so a client that clears its own copy
# of the printed secret is not left with ours in freed memory.
zeroize.workspace = true

# Off by default. A consumer logging with `defmt` derives `Format` on a struct
# holding a `ClientId` and gets E0277 with nothing to do about it but a
# hand-written impl per wrapper or `Debug2Format`, which formats on the target
# and costs flash the controller does not have.
defmt = { workspace = true, optional = true }

[features]
# Derives `defmt::Format` on the identifier, enum, verdict and error
# types. Never on a key or a tag: those have no `Debug` for the same reason.
defmt = ["dep:defmt"]
# Published test inputs as static JSON, with no parser or allocator dependency.
vectors = []

[package.metadata.docs.rs]
features = ["defmt", "vectors"]

# `clippy::pedantic` minus the one lint that contradicts a house rule.
#
# `missing_errors_doc` demands a `# Errors` heading on every function returning
# `Result`; CLAUDE.md forbids "a ceremonial `# Errors` section repeating what
# the `Result` says". Both cannot hold. This is settled here, once, at the
# manifest — not with `#[allow]` at three call sites, which CLAUDE.md bans
# outright and which would have to be repeated on every fallible function
# written from now on.
[lints.clippy]
pedantic = "warn"
missing_errors_doc = "allow"
