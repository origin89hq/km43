# The three spaces P-125 names: a metric whose key 3 is an answer rather than a
# measurement. They were prose under the metric tables until a client had to
# decide what an unrecognised one means, and prose is not something an
# implementation can be generated from.

[[enums.generator_state]]
value = 1
name = "stopped"
meaning = "No AC and our contact open. Autostart may fire"

[[enums.generator_state]]
value = 2
name = "starting"
meaning = "Our contact closed, no AC yet. Gives up after the start window"

[[enums.generator_state]]
value = 3
name = "running"
meaning = "AC present with our contact closed. Ours, and ours to stop"

[[enums.generator_state]]
value = 4
name = "running, not ours"
meaning = "AC present with our contact **open** — somebody started it with the fob. Not a fault, and never rendered as one"

[[enums.generator_state]]
value = 5
name = "stop not honoured"
meaning = "Our command was withdrawn and the AC persists. Notify; never retry"

[[enums.generator_state]]
value = 6
name = "gave up"
meaning = "Commanded to run and it did not, as many times as the starter is worth. The contact stays open and nothing here will try again until a person clears it — out of fuel, an oil-alert shutdown and a flat start battery are indistinguishable from the controller, and hammering a start line into any of them is wrong"


