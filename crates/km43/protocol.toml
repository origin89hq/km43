# ---------------------------------------------------------------------------
# The public equipment dataset's names for readings.
#
# The dataset (origin89hq/offgrid-equipment) names a reading with one flat
# word, `pv-voltage`; this registry names it as a quantity at a place, DC
# voltage at an mppt tracker. The rows below are the one translation, so a
# support list, a client, or an assistant setting a live reading against a
# rated limit all agree on it. A dataset word the protocol cannot carry is
# listed with why, so "not translatable" reads differently from "forgotten".
#
# A lookup takes the first row that matches, and rows are handed over most
# specific first: a row naming both role and point comes before one naming the
# role, which comes before one naming only the point. A battery bank's cell
# temperature is the bank's row's word even when a cell row exists.
#
# `vocabulary` pins the dataset's own list by hash. A row naming a word outside
# it, or a word in it that no row accounts for, fails `cargo xtask check`.
# ---------------------------------------------------------------------------

[dataset]
vocabulary_url = "https://data.origin89.com/v1/vocabulary.json"
vocabulary_file = "dataset-vocabulary.json"
vocabulary_sha256 = "7f9b01da361dc3b1622cf1b8c8e151ef451f1258eadc77e32489a84367ccedf9"
# How the pinned bytes were obtained, as it happened: `just vocabulary --accept`
# writes the fetch it verified against the dataset's index, and nothing else
# writes this line.
vocabulary_provenance = "fetched from https://data.origin89.com/v1/vocabulary.json, listed by the index as sha256 7f9b01da361dc3b1622cf1b8c8e151ef451f1258eadc77e32489a84367ccedf9"
# Live metric kinds that are the controller's own business and have no dataset
# word: a client reads them, an equipment database has no column for them.
internal = [
  "tank sender current",
  "generator starts since commissioning",
  "run contact commanded (bool)",
  "generator selector position (enum, see below)",
  "last boot reason (enum)",
  "log ring utilisation",
]

