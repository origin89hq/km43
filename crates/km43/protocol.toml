#  The registry, as data.
#
#  Data only. The tables in REGISTRY.md are generated from this file; the prose
#  around them is written by hand and stays there, because a data file carrying
#  three kilobytes of markdown is a document with an awkward syntax.
#
#  Edit here, run `cargo xtask registry`, commit both. A number allocated in two places is a number two people can
#  allocate differently, which is the whole failure this registry exists to stop
#  and which it was itself an instance of: PROTOCOL.md said `Pair` authenticates
#  under a derived key while REGISTRY.md said it did not, for an hour, in a repo
#  with five audit rounds behind it.

[meta]
protocol = "1.0"

# The two spaces where an unrecognised value is surfaced rather than refused.
# Everything else is a closed set: an unknown value there is a message whose
# meaning is not knowable, and the generated bindings make that a parse error.
skip_unknown = ["metric_kind", "event_kind"]

